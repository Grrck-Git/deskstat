# DeskStat configuration reference
#
# Use [theme] for shared appearance and [widget.name] for each widget.
# Widget names must be unique and use letters, digits, hyphens or underscores.
# Use # for comments outside quotes. Lists accept comma-separated values or
# arrays of quoted strings. Use the array form for entries containing commas.
#
# Appearance
# text_color and background_color accept case-insensitive names:
# mint, white, black, green, cyan, blue, yellow, amber, orange, red, pink,
# purple, gray, grey, charcoal, darkgray, navy.
# Custom RGB colors use six hex digits inside quotes, e.g. "#FFD600".
# background_opacity: 0 (transparent) to 1 (solid).
# corner_radius: 0 (square) to 2000 points, capped at half the shorter side.
#
# Common widget settings
# type: metrics, weather, markets, chatgpt, command, clock, battery, network, now_playing.
# enabled: true or false. Omit for true.
# left, top: 0–20000 points from the usable desktop's top-left corner.
# x aliases left, y aliases top, and right is a legacy alias for left.
# width: 180–4000 points. height: 80–4000 points.
# ChatGPT requires at least 300 points wide and 150 points tall.
# font_size: 10–32 points. refresh_seconds: 1–86400 seconds.
# Minimum actual refresh: weather 900s, markets 300s, command 5s,
# metrics, clock, battery and network 1s, now_playing 3s.
# ChatGPT updates in response to interaction.
#
# Settings by widget type
# metrics: modules lists cpu, memory, disk, uptime in display order.
# weather: zip is a quoted postal code, or "" to skip lookup.
# country is a two-letter country code. units: fahrenheit or celsius.
# markets: symbols lists 1–12 Yahoo Finance symbols, up to 30 characters
# each with no whitespace. labels supplies optional names in matching order.
# command: command is an executable name or absolute path. Names are
# looked up in /opt/homebrew/bin, /usr/local/bin, /usr/bin and /bin.
# arguments is a list passed directly to the executable, e.g. ["--help"].
# timeout_seconds: 1–60. Commands run directly without a shell.
# clock: time_zones lists 1–8 system time zone IDs, e.g. "America/Chicago"
# or "GMT". cities lists matching labels in order, 1–40 characters each.
# time_format: 12h or 24h. clock_style: cards or text.
# battery and network use the common widget settings.
# now_playing reads Apple Music with macOS Automation permission.

[theme]
# Widget blocks: color, opacity (0–1), corner radius in points.
background_color = charcoal
background_opacity = 0.75
corner_radius = 25
# Names: mint, white, black, green, cyan, blue, yellow, amber, orange,
# red, pink, purple, gray. Hex values must be quoted, for example "#FFD600".
text_color = green

# DeskStat 0.3. Save as plain text, then choose Reload Settings.
# Each section creates a separate widget. Positions are from the main display's
# usable top-left corner. Set enabled = false to hide a widget.

[widget.system]
type = metrics
left = 24
top = 24
width = 360
height = 150
font_size = 13
refresh_seconds = 2
modules = cpu, memory, disk, uptime

[widget.weather]
type = weather
left = 24
top = 190
width = 360
height = 180
# Shared default location: Washington DC.
zip = "20001"
country = US
units = fahrenheit
refresh_seconds = 900

[widget.markets]
type = markets
left = 24
top = 566
width = 360
height = 220
refresh_seconds = 300
# Example watchlist. Edit symbols and matching labels together.
# Yahoo symbols include ^GSPC for the S&P 500, VTI, VOO, and mutual fund symbols.
symbols = ["^GSPC", "VTI"]
labels = ["S&P 500", "Total US market"]

[widget.chatgpt]
type = chatgpt
left = 24
top = 390
width = 360
height = 160

[widget.machine]
type = command
enabled = true
left = 395
top = 194
width = 620
height = 200
command = fastfetch
arguments = []
refresh_seconds = 300
timeout_seconds = 10

[widget.clock]
type = clock
enabled = true
left = 395
top = 24
width = 620
height = 150
font_size = 13
refresh_seconds = 1
# Listed west to east. US zones follow daylight saving time automatically.
time_zones = ["America/Los_Angeles", "America/Chicago", "America/New_York", "GMT"]
cities = ["San Francisco", "Austin, TX", "Washington, DC", "GMT"]
time_format = 24h
clock_style = cards

[widget.battery]
type = battery
left = 395
top = 414
width = 220
height = 112
refresh_seconds = 15

[widget.network]
type = network
left = 635
top = 414
width = 380
height = 112
refresh_seconds = 1

[widget.now-playing]
type = now_playing
left = 395
top = 546
width = 620
height = 135
refresh_seconds = 3
