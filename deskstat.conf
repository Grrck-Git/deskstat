[theme]
# Widget blocks: color, opacity (0–1), corner radius in points.
background_color = charcoal
background_opacity = 0.75
corner_radius = 25
# Names: mint, white, black, green, cyan, blue, yellow, amber, orange,
# red, pink, purple, gray. Hex values must be quoted, for example "#FFD600".
text_color = green

# DeskStat 0.3. Save as plain text, then choose Reload Settings.
# Each section creates a separate widget. Positions are from the main display's
# usable top-left corner. Set enabled = false to hide a widget.

[widget.system]
type = metrics
left = 24
top = 24
width = 360
height = 150
font_size = 13
refresh_seconds = 2
modules = cpu, memory, disk, uptime

[widget.weather]
type = weather
left = 24
top = 190
width = 360
height = 180
# Shared default location: Washington DC.
zip = "20001"
country = US
units = fahrenheit
refresh_seconds = 900

[widget.markets]
type = markets
left = 24
top = 566
width = 360
height = 220
refresh_seconds = 300
# Example watchlist. Edit symbols and matching labels together.
# Yahoo symbols include ^GSPC for the S&P 500, VTI, VOO, and mutual fund symbols.
symbols = ["^GSPC", "VTI"]
labels = ["S&P 500", "Total US market"]

[widget.chatgpt]
type = chatgpt
left = 24
top = 390
width = 360
height = 160

[widget.machine]
type = command
enabled = true
left = 395
top = 194
width = 620
height = 200
command = fastfetch
arguments = []
refresh_seconds = 300
timeout_seconds = 10

[widget.clock]
type = clock
enabled = true
left = 395
top = 24
width = 620
height = 150
font_size = 13
refresh_seconds = 1
# Listed west to east. US zones follow daylight saving time automatically.
time_zones = ["America/Los_Angeles", "America/Chicago", "America/New_York", "GMT"]
cities = ["San Francisco", "Austin, TX", "Washington, DC", "GMT"]
time_format = 24h
clock_style = cards
